<style>
.ad-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.ad-tabs button{padding:10px 18px;border-radius:999px;border:2px solid #e3eaf0;background:#fff;font:700 15.5px 'Hind Siliguri',sans-serif;cursor:pointer;color:#1f3a5f;transition:all .25s}

.ad-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px dashed #dbe4ea}
.ad-row .nm{flex:1;min-width:170px;font-weight:700;color:#1f3a5f}.ad-row .nm small{display:block;color:#5b6b78;font-weight:500;word-break:break-all}

.ad-panel{background:#f7fafc;border:1px solid #e3eaf0;border-radius:18px;padding:16px;margin:8px 0 12px;display:grid;gap:14px}
.ad-panel h4{margin:0 0 6px;color:#1f3a5f}
.ad-inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad-inl input,.ad-inl select,.ad-f input,.ad-f select,.ad-f textarea{padding:9px 12px;border:2px solid #e3eaf0;border-radius:12px;font:500 15.5px 'Hind Siliguri',sans-serif;background:#fff;min-width:0}
.ad-inl input[type=number]{width:100px}
.ad-sm{padding:7px 14px!important;font-size:14px!important}
.ad-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ad-f label{display:block;font-weight:700;color:#1f3a5f;font-size:14.5px;margin-bottom:4px}.ad-f input,.ad-f select{width:100%}
.ad-out{background:#e1f5ee;border-radius:16px;padding:14px;margin-top:14px;display:none}.ad-out textarea{width:100%;border:2px solid #bfe3d8;border-radius:12px;padding:10px;font:14.5px 'Hind Siliguri',sans-serif;margin:6px 0}
.ad-big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.ad-big div{background:#fff;border:1px solid #e3eaf0;border-radius:20px;padding:16px;box-shadow:0 8px 20px rgba(31,58,95,.06)}
.ad-big small{color:#5b6b78;font-weight:600;display:block}.ad-big b{font-size:30px;color:#1f3a5f;line-height:1.2}
.ad-lock{max-width:440px;margin:40px auto}

body.sl-page>.sl-top,body.sl-page>.sl-foot{display:none}

.ad-nav{flex:1;overflow-y:auto;padding:4px 10px 16px}

.ad-nav button:hover{background:rgba(255,255,255,.07)}.ad-nav button.on{background:var(--acc);color:#fff}
.ad-nav .ic{width:22px;text-align:center;flex:none}.ad-nav .tg{margin-left:auto;font-size:11px;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#cfdcec}
.ad-shell.col .ad-side{width:68px}.ad-shell.col .ad-nav .lb,.ad-shell.col .ad-nav .tg,.ad-shell.col .ad-nav .gp,.ad-shell.col .ad-side .bd .tx{display:none}.ad-shell.col .ad-nav button{justify-content:center}
.ad-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ad-topbar{display:flex;align-items:center;gap:10px;padding:12px clamp(12px,2.4vw,28px);background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.ad-topbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;font:700 15px 'Hind Siliguri',sans-serif;cursor:pointer}
.ad-gs{position:relative;flex:1;max-width:520px}.ad-gs input{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:14px;font:500 15.5px 'Hind Siliguri',sans-serif;background:var(--bg);color:inherit}
.ad-gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.18);max-height:60vh;overflow:auto;display:none;z-index:80}
.ad-gres div{padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink)}.ad-gres div:hover{background:var(--bg)}.ad-gres small{color:var(--mut);display:block;font-weight:500}
.ad-demo{background:#fff4dc;color:#8a5a00;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.ad-page{padding:clamp(12px,2.4vw,28px);max-width:1240px;width:100%}
.ad-page h1{margin:0 0 14px;font-size:clamp(24px,3.4vw,34px);color:var(--ink)}.ad-page .sub{color:var(--mut);margin:0 0 14px}
.ad-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:6px}
.ad-cards div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 20px rgba(31,58,95,.06)}
.ad-cards small{color:var(--mut);font-weight:600;display:block}.ad-cards b{font-size:30px;color:var(--ink);line-height:1.2}.ad-cards em{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:2px}
.ad-cards .off{opacity:.62;border-style:dashed}.ad-cards .off b{font-size:20px}
.ad-bars{display:grid;gap:9px}.ad-bars .r{display:grid;grid-template-columns:120px 1fr 44px;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
.ad-bars .tr{background:var(--bg);border-radius:999px;height:14px;overflow:hidden}.ad-bars .tr i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#3f6fd1,#2a9d8f)}
.ad-soon{text-align:center;padding:34px 18px}.ad-soon .big{font-size:54px}.ad-soon ul{display:inline-block;text-align:left;color:var(--mut);line-height:1.8}
.ad-fil{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.ad-fil input,.ad-fil select{padding:9px 12px;border:2px solid var(--line);border-radius:12px;font:500 15px 'Hind Siliguri',sans-serif;background:var(--card);color:inherit}
.ad-ov{display:none}
@media(max-width:900px){.ad-side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .25s;width:280px!important}.ad-shell.open .ad-side{transform:none}.ad-shell.open .ad-ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55}.ad-shell.col .ad-nav .lb,.ad-shell.col .ad-nav .tg,.ad-shell.col .ad-nav .gp{display:initial}.ad-shell.col .ad-nav button{justify-content:flex-start}.ad-bars .r{grid-template-columns:88px 1fr 38px}}
.ad-shell.dk{--bg:#0f1a26;--card:#17232f;--ink:#e6eef7;--mut:#9fb0bd;--line:#2a3a4a;--side:#0a121c;color:#d7e2ec}
.ad-shell.dk .sl-box,.ad-shell.dk .ad-big div,.ad-shell.dk .ad-panel,.ad-shell.dk .ad-tabs button{background:var(--card);border-color:var(--line);color:var(--ink)}
.ad-shell.dk .sl-box h2,.ad-shell.dk .ad-row .nm,.ad-shell.dk .ad-big b,.ad-shell.dk .ad-panel h4,.ad-shell.dk .ad-f label,.ad-shell.dk .sl-f label{color:var(--ink)}
.ad-shell.dk [style*="5b6b78"],.ad-shell.dk .ad-big small,.ad-shell.dk .ad-row .nm small{color:var(--mut)!important}
.ad-shell.dk input,.ad-shell.dk select,.ad-shell.dk textarea{background:#0f1a26!important;color:#e6eef7!important;border-color:var(--line)!important}
.ad-shell.dk .sl-note{background:#2b2616;color:#f0dca8}.ad-shell.dk .ad-demo{background:#3a2f12;color:#ffd98a}
.ad-shell.dk .sl-tbl td{color:#d7e2ec;border-color:var(--line)}.ad-shell.dk .ad-row{border-color:var(--line)}

<script>
(function(){
 if(!window.SL||typeof SL.isAdmin!=='function'||typeof SL.price!=='function'){document.getElementById('app').innerHTML='<div class="sl-box" style="max-width:560px;margin:40px auto;text-align:center"><div style="font-size:48px">⚠️</div><h2>js/demo-saas.js ফাইলটা পুরোনো বা পাওয়া যাচ্ছে না</h2><p style="color:#5b6b78;line-height:1.7">নতুন <b>js/demo-saas.js</b> আর <b>js/prices.js</b> ফাইল দুটো GitHub-এ আপলোড করো (admin.html যে ফোল্ডারে, তার <b>js</b> ফোল্ডারে)। তারপর Ctrl+F5 চাপো।</p></div>';return;}
 var C=SL.cfg,bn=SL.bn,esc=SL.esc,DAY=864e5,app=document.getElementById('app'),tab='ov',openId=null,search='',last=null;
 function q(i){return document.getElementById(i);}
 function fd(t){return t?new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'short',year:'numeric'}):'—';}
 function money(n){return '৳'+bn(Math.round(n));}
 function admHash(){try{return JSON.parse(localStorage.getItem('sl_admin')||'null');}catch(e){return null;}}
 function toast(t){try{if(window.ADO&&!/^❌/.test(String(t))){var nv=navOf(tab);ADO.log(String(t).replace(/^[^A-Za-z0-9\u0980-\u09FF]+/,'').slice(0,90),'মেনু: '+(nv?nv.t:tab),/পাসওয়ার্ড|লগইন|রোল/.test(t)?'auth':/পেমেন্ট|রিফান্ড|অনুরোধ|মেয়াদ/.test(t)?'money':'action');}}catch(x){}var e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f3a5f;color:#fff;padding:11px 22px;border-radius:999px;font-weight:700;z-index:9999;box-shadow:0 10px 24px rgba(0,0,0,.25)';document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}
 function copy(id){var e=q(id);e.select();try{document.execCommand('copy');toast('✅ কপি হয়েছে');}catch(x){toast('হাতে কপি করো');}}
 function stat(a){var s=SL.status(a);return s;}
 function badge(a){var s=stat(a);return s.state==='active'&&s.comp?'<span class="bdg t">🎁 ফ্রি অ্যাক্সেস · '+bn(s.left)+' দিন</span>':s.state==='active'?'<span class="bdg">✅ চালু · '+bn(s.left)+' দিন</span>':s.state==='trial'?'<span class="bdg t">🎁 ট্রায়াল · '+bn(s.left)+' দিন</span>':s.state==='suspended'?'<span class="bdg s">🚫 বন্ধ</span>':'<span class="bdg x">⛔ মেয়াদ শেষ</span>';}
 var CLOUD=SL.cloud,TOK='',CACHE={acc:{},prog:{}},loaded=false;
 try{TOK=localStorage.getItem('sl_admin_token')||'';if(TOK&&!SL.isAdmin()){localStorage.removeItem('sl_admin_token');TOK='';}}catch(e){}
 function link(a,mem){var b=new URL('account.html',location.href).href;return CLOUD?b:b+'#a='+SL.pack(a,!!mem);}
 function accMap(){return CLOUD?CACHE.acc:SL.get().acc;}
 function dbLoad(){
  if(!CLOUD)return Promise.resolve(true);
  return SL.api({a:'adm_list',k:TOK}).then(function(r){
   if(!r.ok){toast('❌ '+(r.err||'ক্লাউড থেকে লোড হয়নি'));return false;}
   CACHE={acc:{},prog:r.prog||{}};(r.acc||[]).forEach(function(a){a.members=a.members||[];a.pays=a.pays||[];a.reqs=a.reqs||[];CACHE.acc[a.email]=a;});loaded=true;return true;
  });
 }
 function dbSave(email){
  if(!CLOUD)return;
  SL.api({a:'adm_put',k:TOK,email:email,rec:CACHE.acc[email]}).then(function(r){
   if(!r.ok)return toast('❌ ক্লাউডে সেভ হয়নি: '+(r.err||''));
   var a=CACHE.acc[email];if(a&&r.acc){a.reqs=r.acc.reqs;a.members=r.acc.members;a.mv=r.acc.mv;}
  });
 }
 function dbDel(email){
  if(!CLOUD){var x=SL.get();delete x.acc[email];delete x.prog[email];if(x.ses===email)x.ses=null;SL.put(x);return;}
  delete CACHE.acc[email];SL.api({a:'adm_del',k:TOK,email:email}).then(function(r){if(!r.ok)toast('❌ মুছতে পারেনি: '+(r.err||''));});
 }
 function dbCreate(a){if(CLOUD){CACHE.acc[a.email]=a;dbSave(a.email);}else{var x=SL.get();x.acc[a.email]=a;SL.put(x);}}
 function dbProg(email){return CLOUD?(CACHE.prog[email]||{}):SL.progress(email);}
 function mut(email,fn){
  if(CLOUD){var a=CACHE.acc[email];if(!a)return;fn(a);dbSave(email);return;}
  var x=SL.get(),a=x.acc[email];if(!a)return;fn(a,x);SL.put(x);
 }
 function approveReq(em,rid){mut(em,function(a){var r=(a.reqs||[]).filter(function(x){return x.id===rid;})[0];if(!r||r.status!=='pending')return;a.kind=r.plan;if(r.bands&&r.bands.length)a.bands=r.bands;if(r.plan==='custom'){a.seats=r.seats||1;a.subs=r.subs||[];}adjust(a,SL.days(r.plan,r.period));a.pays.unshift({t:Date.now(),plan:r.plan,period:r.period,price:r.price,trx:r.trx,req:rid});r.status='approved';});toast('✅ অনুমোদিত, প্ল্যান চালু হয়েছে');}
 function rejectReq(em,rid){mut(em,function(a){var r=(a.reqs||[]).filter(function(x){return x.id===rid;})[0];if(r&&r.status==='pending')r.status='rejected';});toast('অনুরোধ বাতিল করা হয়েছে');}
 function pendList(){var o=[];list().forEach(function(a){(a.reqs||[]).forEach(function(r){if(r.status==='pending')o.push([a,r]);});});return o;}
 function pendBadge(a){var n=(a.reqs||[]).filter(function(r){return r.status==='pending';}).length;return n?'<span class="bdg x">🔔 '+bn(n)+' অনুরোধ</span>':'';}
 function reqLine(a,r,pre){return '<div class="ad-row"><div class="nm">'+esc(a.school||a.name)+' · '+((C.PLANS[r.plan]||{name:r.plan}).name)+' ('+(r.period==='week'?'সাপ্তাহিক':'মাসিক')+')<small>'+esc(a.email)+(r.bands&&r.bands.length?' · 🎓 '+SL.bandsLabel(r.bands):'')+(r.plan==='custom'?' · 🧩 '+bn(r.seats||1)+' জন, '+(r.subs||[]).map(function(k){return SL.SUBJ[k];}).join('+'):'')+' · '+(r.method==='nagad'?'🟠 নগদ':r.method==='bkash'?'🟣 বিকাশ':'')+(r.from?' <b>'+esc(r.from)+'</b>':'')+' · TrxID: <b>'+esc(r.trx)+'</b> · '+fd(r.t)+'</small></div><b>'+money(r.price)+'</b><button class="slb o ad-sm" data-'+pre+'a="'+esc(a.email)+'|'+r.id+'">✅ অনুমোদন</button><button class="slb r" data-'+pre+'r="'+esc(a.email)+'|'+r.id+'">বাতিল</button></div>';}
 function reqPanel(a){var p=(a.reqs||[]).filter(function(r){return r.status==='pending';});return p.length?'<div><h4>🔔 পেমেন্ট অনুরোধ</h4>'+p.map(function(r){return reqLine(a,r,'p');}).join('')+'</div>':'';}
 function progHTML(a){
  var pg=dbProg(a.email),pl=SL.profiles(a),h='',any=false;
  pl.forEach(function(p){var o=pg[p.id]||{},ks=Object.keys(o);if(!ks.length)return;any=true;var avg=Math.round(ks.reduce(function(x,k){return x+o[k].pc;},0)/ks.length);h+='<div style="padding:2px 0">'+esc(p.name)+': <b>'+bn(ks.length)+'টি অধ্যায়, গড় '+bn(avg)+'%</b></div>';});
  return '<div><h4>📈 অগ্রগতি</h4>'+(any?h:'<small style="color:#5b6b78">এখনও কুইজ দেয়নি</small>')+'</div>';
 }
 function customEd(a){var S=SL.SUBJ,subs=a.subs||[];return '<div class="ad-inl"><b>🧩 কাস্টম প্ল্যান:</b> জন <input type="number" id="cseat" min="1" max="30" value="'+(a.seats||1)+'" style="width:80px">'+Object.keys(S).map(function(k){return '<label style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" class="csub" value="'+k+'"'+(subs.indexOf(k)>-1?' checked':'')+'>'+S[k]+'</label>';}).join(' ')+'<button class="slb s ad-sm" data-cs="1">💾 সেভ</button></div>';}
 function classDevEd(a){var P=C.PLANS[a.kind]||C.PLANS.student,bs=SL.myBands(a),dl=a.devs||[];
  return '<div class="ad-inl"><b>🎓 ক্লাস:</b>'+SL.CLASSES.map(function(c){return '<label style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" class="bsb" value="'+c.id+'"'+(bs.indexOf(c.id)>-1?' checked':'')+'>'+SL.bandsLabel([c.id])+'</label>';}).join(' ')+'<button class="slb s ad-sm" data-bs="1">💾 সেভ</button>'+((a.bands&&a.bands.length)?'':'<small style="color:#5b6b78">(ক্লাস সেট করা নেই, ৯–১০ ধরা হচ্ছে)</small>')+'</div>'
  +'<div class="ad-inl"><b>📱 ডিভাইস ('+bn(dl.length)+'/'+bn(P.devices)+'):</b> '+(dl.length?dl.map(function(x){return '<span class="bdg s">'+esc(x.n)+'</span>';}).join(' '):'<small style="color:#5b6b78">নেই</small>')+(dl.length?'<button class="slb r ad-sm" data-dv="1">♻️ সব ডিভাইস রিসেট</button>':'')+'</div>';}
