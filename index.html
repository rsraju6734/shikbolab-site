<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShikboLab - নিজে করে বিজ্ঞান শেখো</title>
<meta name="description" content="ShikboLab: বাংলায় বিজ্ঞান ও গণিতের ইন্টারঅ্যাকটিভ ভার্চুয়াল ল্যাব, পাঠ ও কুইজ।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1f3a5f;--ink:#22303c;--muted:#5b6b78;--line:#e3eaf0;--bg:#f4f8fb;--org:#e9a23b;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Hind Siliguri",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
/* page background blobs */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(180deg,#f3f8fc,#fbf8f1)}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vw;height:46vw;left:-10vw;top:-12vw;background:#bfe9e3}
.bg i:nth-child(2){width:40vw;height:40vw;right:-8vw;top:10vh;background:#ffd9b8;animation-delay:-6s}
.bg i:nth-child(3){width:38vw;height:38vw;left:30vw;bottom:-18vw;background:#cfdcff;animation-delay:-12s}
@keyframes drift{to{transform:translate(6vw,4vw) scale(1.12)}}
/* nav */
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:12px clamp(16px,4vw,48px);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(31,58,95,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:24px;color:var(--navy);letter-spacing:-.01em}
.brand span{color:#e76f51}
.brand svg{width:34px;height:34px}
.nav nav{display:flex;gap:6px}
.nav nav button{padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--navy);transition:background .25s,transform .25s}
.nav nav button:hover{background:rgba(31,58,95,.08);transform:translateY(-1px)}
/* hero */
.hero{position:relative;min-height:min(82vh,720px);display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:20px;padding:40px clamp(16px,5vw,72px) 30px;max-width:1280px;margin:0 auto}
#net{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hero>*{position:relative;z-index:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px;color:#2a9d8f;box-shadow:0 4px 14px rgba(31,58,95,.07)}
.pill b{width:8px;height:8px;border-radius:50%;background:#2a9d8f;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(42,157,143,.5)}100%{box-shadow:0 0 0 10px rgba(42,157,143,0)}}
.hero h1{font-size:clamp(34px,5.4vw,68px);line-height:1.18;color:var(--navy);margin:18px 0 14px;letter-spacing:-.02em;font-weight:700}
.hero h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.12em}
.hero h1 .w>span{display:inline-block;transform:translateY(110%);animation:up .9s var(--ease) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes up{to{transform:none}}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#e76f51,#e9a23b,#2a9d8f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.hero p.lead{font-size:clamp(16px,1.6vw,19px);color:var(--muted);max-width:560px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;font-weight:700;font-size:17px;transition:transform .3s var(--ease),box-shadow .3s}
.btn.p{background:linear-gradient(135deg,#1f3a5f,#2f5d9e);color:#fff;box-shadow:0 10px 24px rgba(31,58,95,.28)}
.btn.s{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn:hover{transform:translateY(-3px)}
.btn.p:hover{box-shadow:0 16px 30px rgba(31,58,95,.34)}
.btn .ar{transition:transform .3s var(--ease)}.btn:hover .ar{transform:translateX(5px)}
.stats{display:flex;gap:clamp(16px,3vw,36px);margin-top:26px;flex-wrap:wrap}
.stats div{min-width:84px}
.stats b{display:block;font-size:clamp(28px,3.4vw,40px);line-height:1.1;color:var(--navy);font-weight:700}
.stats small{color:var(--muted);font-size:14px}
/* orbit */
.orb{position:relative;width:min(100%,420px);aspect-ratio:1;margin:0 auto}
.orb .core{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;margin:-17% 0 0 -17%;border-radius:50%;display:grid;place-items:center;font-size:clamp(36px,6vw,64px);background:radial-gradient(circle at 30% 25%,#fff,#e5f0ff 60%,#cfdcff);box-shadow:0 20px 50px rgba(63,111,209,.35),inset 0 -8px 20px rgba(63,111,209,.15);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.orb .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(31,58,95,.18)}
.orb .ring.r2{inset:14%;border-color:rgba(231,111,81,.25)}
.orb .spin{position:absolute;inset:0;animation:spin 28s linear infinite}
.orb .spin.b{inset:14%;animation-duration:20s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sat{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px;transform:rotate(var(--a)) translateX(var(--r))}
.sat i{display:block;transform:rotate(calc(var(--a)*-1))}
.sat span{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;font-size:28px;background:#fff;box-shadow:0 10px 24px rgba(31,58,95,.18);border:3px solid var(--c);animation:spin 28s linear infinite reverse}
.spin.b .sat span{animation-duration:20s;animation-direction:normal}
.sat.s2{width:50px;height:50px;margin:-25px}.sat.s2 span{width:50px;height:50px;font-size:22px}
/* sections */
.sec{max-width:1280px;margin:0 auto;padding:30px clamp(16px,5vw,72px)}
.sec h2{font-size:clamp(26px,3.4vw,38px);color:var(--navy);line-height:1.25;letter-spacing:-.01em}
.sec .sub{color:var(--muted);margin:4px 0 22px;font-size:17px}
.rv{opacity:0;transform:translateY(26px)}
.rv.in{opacity:1;transform:none;transition:opacity .7s var(--ease),transform .7s var(--ease);transition-delay:var(--d,0ms)}
/* subject cards */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:22px}
.scard{--c:#2a9d8f;position:relative;display:flex;flex-direction:column;text-align:left;padding:22px 22px 20px;border-radius:26px;background:#fff;border:1px solid var(--line);overflow:hidden;transform-style:preserve-3d;transition:box-shadow .4s,border-color .4s;box-shadow:0 8px 24px rgba(31,58,95,.07);min-height:340px}
.scard::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),transparent 62%);opacity:.9;z-index:0}
.scard::after{content:"";position:absolute;left:-30%;top:-10%;width:30%;height:140%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(0) rotate(12deg);transition:transform .9s var(--ease);z-index:2;pointer-events:none}
.scard:hover::after{transform:translateX(520%) rotate(12deg)}
.scard:hover{box-shadow:0 24px 50px rgba(31,58,95,.18);border-color:var(--c)}
.scard>*{position:relative;z-index:1}
.scard .art{width:130px;height:130px;margin:0 0 8px -4px}
.scard h3{font-size:30px;color:var(--navy);line-height:1.2}
.scard .tg{color:var(--muted);font-size:15.5px;margin:4px 0 14px}
.scard .cnt{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.scard .cnt span{font-weight:600;font-size:14.5px;color:var(--c);background:#fff;padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.scard .go{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:22px;transition:transform .4s var(--ease);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.scard:hover .go{transform:translateX(6px) rotate(-8deg) scale(1.08)}
/* bonus */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.pills button{padding:8px 18px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:600;font-size:15px;color:var(--navy);transition:all .25s}
.pills button:hover{transform:translateY(-2px)}
.pills button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.bt{--c:#2a9d8f;position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;background:#fff;border:2px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;overflow:hidden}
.bt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.bt:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:0 16px 34px rgba(31,58,95,.14);border-color:var(--c)}
.bt .em{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:color-mix(in srgb,var(--c) 14%,#fff);transition:transform .5s var(--ease)}
.bt:hover .em{transform:scale(1.15) rotate(10deg)}
.bt h4{font-size:17px;line-height:1.35;color:var(--navy)}
.bt p{font-size:14px;color:var(--muted);line-height:1.5;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bt .tag{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;color:var(--c)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s}
.step{position:relative;padding:24px 20px 20px;border-radius:22px;background:rgba(255,255,255,.8);border:1px solid var(--line);backdrop-filter:blur(6px)}
.step .n{position:absolute;right:16px;top:8px;font-size:60px;font-weight:700;color:rgba(31,58,95,.07);line-height:1}
.step .ic{font-size:36px;display:inline-block;animation:bob 3.4s ease-in-out infinite;animation-delay:var(--d)}
.step h4{font-size:20px;color:var(--navy);margin:6px 0 2px}
.step p{color:var(--muted);font-size:15.5px}
/* subject view */
.back{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:600;color:var(--navy);transition:transform .3s,border-color .3s;margin-bottom:16px}
.back:hover{transform:translateX(-4px);border-color:var(--navy)}
.banner{--c:#2a9d8f;position:relative;display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:clamp(20px,3vw,34px);border-radius:30px;color:#fff;overflow:hidden;background:linear-gradient(135deg,var(--c),var(--c2));box-shadow:0 24px 50px -16px var(--c)}
.banner::before,.banner::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:drift 12s ease-in-out infinite alternate}
.banner::before{width:260px;height:260px;right:-60px;top:-90px}
.banner::after{width:160px;height:160px;right:140px;bottom:-80px;animation-delay:-5s}
.banner .art{width:clamp(96px,14vw,150px);height:auto;flex:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.2));position:relative;z-index:1;background:rgba(255,255,255,.2);border-radius:28px;padding:10px}
.banner .bx{position:relative;z-index:1;flex:1;min-width:220px}
.banner h2{font-size:clamp(30px,4.4vw,48px);line-height:1.15}
.banner p{opacity:.92;font-size:17px;margin-top:4px}
.banner .ch2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.banner .ch2 span{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);padding:5px 14px;border-radius:999px;font-weight:600;font-size:14.5px}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:26px 0 14px}
.tools h3{font-size:26px;color:var(--navy);flex:1;min-width:150px}
.search{position:relative;flex:0 1 300px;width:100%}
.search input{width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:2px solid var(--line);font:inherit;font-size:16px;background:#fff;outline:none;transition:border-color .25s,box-shadow .25s}
.search input:focus{border-color:var(--navy);box-shadow:0 0 0 4px rgba(31,58,95,.1)}
.search::before{content:"🔎";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.ch{--c:#2a9d8f;position:relative;display:flex;gap:16px;padding:18px;border-radius:22px;background:#fff;border:2px solid var(--line);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
.ch::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,color-mix(in srgb,var(--c) 10%,transparent),transparent 60%);transform:translateX(-100%);transition:transform .7s var(--ease)}
.ch:hover::after{transform:translateX(100%)}
.ch:hover{transform:translateY(-6px);box-shadow:0 18px 36px rgba(31,58,95,.14);border-color:var(--c)}
.ch .num{flex:none;width:62px;height:72px;border-radius:18px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 8px 18px -6px var(--c);transition:transform .5s var(--ease)}
.ch:hover .num{transform:rotate(-6deg) scale(1.06)}
.ch .num small{font-size:11px;opacity:.9;font-weight:600}
.ch .num b{font-size:28px;font-weight:700}
.ch .num.em b{font-size:30px}
.ch .tx{position:relative;z-index:1;min-width:0}
.ch h3{font-size:18.5px;line-height:1.35;color:var(--navy)}
.ch p{font-size:14.5px;color:var(--muted);line-height:1.5;margin:3px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;padding:4px 12px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.ch:hover .chip .ar{transform:translateX(4px)}.chip .ar{transition:transform .3s}
.ch.soon{opacity:.6;pointer-events:none;filter:grayscale(.6)}
.empty{padding:24px;border:2px dashed var(--line);border-radius:20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.6)}
.xhead{margin:34px 0 14px}
.xhead h3{font-size:26px;color:var(--navy)}.xhead p{color:var(--muted)}
footer{margin-top:50px;padding:26px 16px 34px;text-align:center;color:var(--muted);font-size:14.5px}
footer b{color:var(--navy)}
@media (max-width:860px){.hero{grid-template-columns:1fr;text-align:left;min-height:0;padding-top:26px}.orb{width:min(78vw,340px);order:-1;margin-bottom:-6px}}
@media (max-width:480px){.nav nav a.plb{padding:7px 11px!important;font-size:14px;margin-left:0!important}.nav nav button:nth-child(3){display:none}.nav nav button{padding:7px 11px;font-size:14px}.brand{font-size:21px}.cgrid{grid-template-columns:1fr}.sat{width:50px;height:50px;margin:-25px}.sat span{width:50px;height:50px;font-size:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}.hero h1 .w>span{transform:none}}
/* subject art animation */
.ab{animation:abub 3s ease-in infinite}
@keyframes abub{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-52px);opacity:0}}
.wv{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-40px)}}
.dr{animation:twist 3.2s ease-in-out infinite;transform-origin:60px 0}
@keyframes twist{50%{transform:scaleX(-1)}}
.dash{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 4s ease-in-out infinite}
@keyframes draw{60%,100%{stroke-dashoffset:0}}
.nuc{animation:pulse2 2s ease-in-out infinite;transform-origin:60px 60px}
@keyframes pulse2{50%{transform:scale(1.25)}}
.fl{animation:bob 3s ease-in-out infinite}
html,body{overflow-x:clip}
/* ===== v2: লাইভ খেলার জায়গা, ফিতা, কার্সর গ্লো ===== */
.cg{position:fixed;left:0;top:0;width:380px;height:380px;border-radius:50%;pointer-events:none;z-index:0;background:radial-gradient(circle,rgba(63,111,209,.18),rgba(42,157,143,.08) 45%,transparent 68%);transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
.sp{position:fixed;left:0;top:0;height:4px;width:100%;z-index:200;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,#2a9d8f,#e9a23b,#e76f51)}
.tw{margin-top:10px;font-size:clamp(16px,1.7vw,20px);font-weight:600;color:var(--navy);min-height:1.7em}
.tw b{color:#e76f51}.tw i{display:inline-block;width:2px;height:1.1em;background:#e76f51;margin-left:3px;vertical-align:-.15em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mq{position:relative;overflow:hidden;padding:14px 0;margin:6px 0 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mqi{display:flex;gap:12px;width:max-content;animation:mq 70s linear infinite}
.mq:hover .mqi{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mqc{--c:#2a9d8f;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-weight:600;font-size:15px;color:var(--navy);transition:transform .3s var(--ease),border-color .3s,box-shadow .3s}
.mqc::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.mqc:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 20px rgba(31,58,95,.12)}
.play{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:22px;align-items:start;padding:22px;border-radius:30px;background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(31,58,95,.28);backdrop-filter:blur(8px)}
.pstage{padding:10px 10px 8px;border-radius:24px;background:linear-gradient(150deg,#2b3d58,#121c2e 70%);box-shadow:0 22px 44px -14px rgba(12,26,52,.6)}
.pstage .ph{display:flex;gap:6px;align-items:center;padding:2px 4px 8px;color:#9fb3d1;font-size:12.5px;font-weight:700;letter-spacing:.04em}
.pstage .ph i{width:10px;height:10px;border-radius:50%;background:#e5484d;box-shadow:0 0 8px #e5484d}.pstage .ph i:nth-child(2){background:#f5b301;box-shadow:0 0 8px #f5b301}.pstage .ph i:nth-child(3){background:#22c55e;box-shadow:0 0 8px #22c55e}
.pstage canvas{display:block;width:100%;height:auto;border-radius:14px;background:#fff}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.ptabs button{padding:9px 18px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:15.5px;color:var(--navy);transition:all .25s}
.ptabs button:hover{transform:translateY(-2px)}.ptabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 8px 18px -6px rgba(31,58,95,.5)}
.pctl label{display:block;font-weight:600;color:var(--navy);margin:12px 0 2px}.pctl label b{display:inline-block;min-width:38px;text-align:center;background:#eaf1fb;color:#2a4a9e;padding:0 10px;border-radius:99px;margin-left:6px}
.pctl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;outline:none;background:linear-gradient(90deg,#3f6fd1 var(--p,50%),#dde5ee var(--p,50%))}

  info.innerHTML='pH <b>'+bn(v)+'</b> ➜ দ্রবণ <b>'+kind+'</b>। pH ৭-এর কম হলে অম্ল, ৭ হলে নিরপেক্ষ, ৭-এর বেশি হলে ক্ষার।<br><small>(রংগুলো ইউনিভার্সাল ইন্ডিকেটরের আনুমানিক রং, আমার আঁকা)</small>';}
