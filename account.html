<!DOCTYPE html>

<head>

<title>অ্যাকাউন্ট — ShikboLab</title>
<meta name="description" content="ShikboLab অ্যাকাউন্ট: সাইন-আপ, লগইন ও সাবস্ক্রিপশন।">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body class="sl-page">
<header class="sl-top"><a class="brand" href="index.html">Shikbo<span>Lab</span></a><nav><a href="index.html">হোম</a><a href="plans.html">প্ল্যান</a><a class="on" href="account.html">অ্যাকাউন্ট</a></nav></header>
<main class="sl-wrap" id="app"></main>
<div class="sl-foot">ডেমো মোড · ডাটা শুধু এই ব্রাউজারে থাকে</div>
<script>
(function(){
 var C=SL.cfg,bn=SL.bn,esc=SL.esc,app=document.getElementById('app'),logoData='';
 var DEMO=SL.cloud?'<div class="sl-note" style="background:#e1f5ee;border-left-color:#2a9d8f">☁️ <b>তোমার অ্যাকাউন্ট ক্লাউডে সেভ থাকে।</b> যেকোনো ফোন বা কম্পিউটারে ইমেইল-পাসওয়ার্ড দিয়ে লগইন করা যায়।</div>':'<div class="sl-note">⚠️ <b>ডেমো মোড:</b> তোমার তথ্য শুধু এই ব্রাউজারে সেভ হয়। পেমেন্টে আসল টাকা কাটে না। আসল বিক্রির সময় সার্ভার-সংস্করণ ব্যবহার হবে।</div>';
 function q(id){return document.getElementById(id);}
 function msg(id,t,ok){var e=q(id);if(!e)return;e.className=ok?'sl-ok':'sl-err';e.textContent=t;e.style.display=t?'block':'none';}
 function fd(t){return new Date(t).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});}
 /* ---- লগইন/সাইন আপ ---- */
 function authView(){
  var pre=(new URLSearchParams(location.search).get('plan'))||'student',tab=location.hash==='#login'?'login':'signup';
  if(!C.PLANS[pre])pre='student';if(C.PLANS[pre].big)pre='school';if(C.PLANS[pre].custom&&!SL.cloud)pre='student';
  app.innerHTML='<div class="sl-hero"><h1>'+(tab==='login'?'আবার স্বাগতম 👋':(C.TRIAL_CH.length?'ফ্রি ট্রায়াল শুরু করো 🎁':'ফ্রি অ্যাকাউন্ট খোলো 🆓'))+'</h1><p>'+(C.TRIAL_CH.length?bn(C.TRIAL_DAYS)+' দিন বাছাই করা অধ্যায় খোলা, কার্ড লাগে না।':'ফ্রি অধ্যায়গুলো সবসময় খোলা। বাকি অধ্যায়ের জন্য ক্লাস অনুযায়ী প্ল্যান নিতে হয়।')+'</p></div>'+DEMO
  +'<div class="sl-box" style="max-width:560px;margin:18px auto"><div class="sl-tabs"><button data-t="signup" class="'+(tab==='signup'?'on':'')+'">নতুন অ্যাকাউন্ট</button><button data-t="login" class="'+(tab==='login'?'on':'')+'">লগইন</button></div>'
  +'<form id="fs" class="sl-f" style="'+(tab==='signup'?'':'display:none')+'"><div><label>তুমি কে?</label><div class="sl-kinds">'
  +Object.keys(C.PLANS).filter(function(k){return !C.PLANS[k].off&&!C.PLANS[k].big&&(SL.cloud||!C.PLANS[k].custom);}).map(function(k){var p=C.PLANS[k];return '<label><input type="radio" name="kind" value="'+k+'"'+(k===pre?' checked':'')+'><span><em>'+p.emoji+'</em>'+p.name.replace(' প্ল্যান','')+'<small>'+p.desc+'</small></span></label>';}).join('')
  +'</div></div><div id="sw" style="display:none"><label>স্কুলের নাম *</label><input id="school" placeholder="যেমন: নারায়ণগঞ্জ আদর্শ স্কুল"></div>'
  +'<div id="lw" style="display:none"><label>স্কুলের লোগো (ঐচ্ছিক)</label><input id="logo" type="file" accept="image/*"></div>'
  +'<div><label>তোমার নাম *</label><input id="nm" autocomplete="name"></div><div><label>ইমেইল অথবা মোবাইল নম্বর *</label><input id="em" autocomplete="username" placeholder="you@gmail.com বা 01712345678"></div><div id="rw" style="display:none"><label>ইমেইল (ঐচ্ছিক, পাসওয়ার্ড ভুলে গেলে কোড পাঠাতে)</label><input id="rem" type="email" autocomplete="email" placeholder="you@gmail.com"></div><div><label>পাসওয়ার্ড * (কমপক্ষে ৮ অক্ষর, অক্ষর+সংখ্যা মিলিয়ে)</label><input id="pw" type="password" autocomplete="new-password"></div>'
  +'<div id="e1" class="sl-err"></div><button class="slb o" type="submit">'+(C.TRIAL_CH.length?'🎁 ফ্রি ট্রায়াল শুরু করো':'🆓 ফ্রি অ্যাকাউন্ট খোলো')+'</button></form>'
  +'<form id="fl" class="sl-f" style="'+(tab==='login'?'':'display:none')+'"><div><label>ইমেইল অথবা মোবাইল নম্বর</label><input id="lem" autocomplete="username"></div><div><label>পাসওয়ার্ড</label><input id="lpw" type="password" autocomplete="current-password"></div><div id="e2" class="sl-err"></div><div id="dvl"></div><button class="slb p" type="submit">লগইন</button>'+(SL.cloud?'<p style="margin:10px 0 0;text-align:center"><a href="#" id="fg" style="color:#3f6fd1;font-weight:600">🔑 পাসওয়ার্ড ভুলে গেছ?</a></p>':'')+'</form></div>';
  var tabs=app.querySelectorAll('.sl-tabs button');
  [].forEach.call(tabs,function(b){b.onclick=function(){location.hash='#'+b.dataset.t;authView();};});
  function kind(){return app.querySelector('input[name=kind]:checked').value;}
  function sync(){q('sw').style.display=q('lw').style.display=kind()==='school'?'block':'none';}
  [].forEach.call(app.querySelectorAll('input[name=kind]'),function(r){r.onchange=sync;});sync();
  q('em').oninput=function(){var v=q('em').value.trim();q('rw').style.display=(v&&v.indexOf('@')<0&&SL.normId(v))?'block':'none';};
  if(q('fg'))q('fg').onclick=function(e){e.preventDefault();resetView(q('lem').value);};
  q('logo').onchange=function(){SL.logoFromFile(this.files[0],function(u){logoData=u;});};
  q('fs').onsubmit=function(e){e.preventDefault();
   SL.signup({kind:kind(),school:q('school').value,logo:logoData,name:q('nm').value,email:q('em').value,rem:q('rem').value,pass:q('pw').value}).then(function(r){if(!r.ok)return msg('e1',r.err);location.hash='';location.reload();});};
  try{var pf=sessionStorage.getItem('sl_prefill');if(pf){q('lem').value=pf;sessionStorage.removeItem('sl_prefill');}}catch(e){}
  q('fl').onsubmit=function(e){e.preventDefault();var em=q('lem').value,pw=q('lpw').value;q('dvl').innerHTML='';msg('e2','');SL.login(em,pw).then(function(r){if(!r.ok){msg('e2',r.err);if(r.devfull)devList(r,em,pw);return;}location.hash='';location.reload();});};
 }
 /* ---- পাসওয়ার্ড রিসেট (ইমেইলে কোড) ---- */
 function resetView(pre){
  app.innerHTML='<div class="sl-hero"><h1>পাসওয়ার্ড রিসেট 🔑</h1><p>ইমেইলে ৬ অঙ্কের কোড যাবে। কোড দিয়ে নতুন পাসওয়ার্ড বসাও।</p></div>'
  +'<div class="sl-box" style="max-width:520px;margin:18px auto"><form id="r1" class="sl-f"><div><label>ইমেইল অথবা মোবাইল নম্বর</label><input id="ri" autocomplete="username" value="'+esc(pre||'')+'"></div><div id="e5" class="sl-err"></div><div id="o5" class="sl-ok"></div><button class="slb p" type="submit" id="rb1">📨 কোড পাঠাও</button></form>'
  +'<form id="r2" class="sl-f" style="display:none;margin-top:14px"><div><label>ইমেইলে আসা ৬ অঙ্কের কোড</label><input id="rc" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div><div><label>নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর, অক্ষর+সংখ্যা)</label><input id="rp" type="password" autocomplete="new-password"></div><div id="e6" class="sl-err"></div><button class="slb o" type="submit">✅ পাসওয়ার্ড বদলাও</button></form>'
  +'<p style="text-align:center;margin:14px 0 0"><a href="#" id="rback" style="color:#3f6fd1;font-weight:600">← লগইনে ফিরে যাও</a></p>'
  +'<p style="color:#5b6b78;font-size:14.5px;text-align:center;margin:8px 0 0">ইমেইল না এলে স্প্যাম ফোল্ডার দেখো। মোবাইল নম্বরে খোলা অ্যাকাউন্টে ইমেইল দেওয়া না থাকলে অ্যাডমিনকে WhatsApp করো।</p></div>';
  q('rback').onclick=function(e){e.preventDefault();history.replaceState(null,'','#login');authView();};
  q('r1').onsubmit=function(e){e.preventDefault();msg('e5','');msg('o5','');var b=q('rb1');b.disabled=true;
   SL.resetRequest(q('ri').value).then(function(r){b.disabled=false;if(!r.ok)return msg('e5',r.err||'কোড পাঠানো যায়নি');msg('o5',r.msg||'কোড পাঠানো হয়েছে',true);if(!r.noMail)q('r2').style.display='grid';});};
  q('r2').onsubmit=function(e){e.preventDefault();msg('e6','');
   SL.resetDo(q('ri').value,q('rc').value,q('rp').value).then(function(r){if(!r.ok)return msg('e6',r.err||'বদলানো যায়নি');try{sessionStorage.setItem('sl_prefill',q('ri').value);}catch(x){}history.replaceState(null,'','#login');authView();msg('e2','✅ পাসওয়ার্ড বদলেছে। নতুন পাসওয়ার্ড দিয়ে লগইন করো।',true);});};
 }
 function devList(r,em,pw){
  var box=q('dvl');box.innerHTML='<p style="margin:8px 0 4px;font-weight:700;color:#1f3a5f">📱 এই ডিভাইসগুলোতে লগইন আছে ('+bn((r.devs||[]).length)+'/'+bn(r.lim||0)+'):</p>'+(r.devs||[]).map(function(x){return '<div class="sl-mem"><div class="nm">'+esc(x.n)+'<small>শেষ ব্যবহার: '+fd(x.t)+'</small></div><button type="button" class="slb r" data-rd="'+esc(x.id)+'">সরাও</button></div>';}).join('')+'<p style="color:#5b6b78;font-size:14.5px;margin:6px 0 0">যেটা আর ব্যবহার করো না সেটা "সরাও" চাপো, তারপর নিজে থেকেই এই ডিভাইসে লগইন হবে।</p>';
  [].forEach.call(box.querySelectorAll('[data-rd]'),function(b){b.onclick=function(){b.disabled=true;SL.devRemove(em,pw,b.dataset.rd).then(function(x){if(!x.ok){b.disabled=false;return msg('e2',x.err||'সরানো যায়নি');}q('fl').dispatchEvent(new Event('submit',{cancelable:true}));});};});
 }
 /* ---- ড্যাশবোর্ড ---- */
 function meter(u,t,lab){return '<div><small style="color:#5b6b78;font-weight:600">'+lab+'</small><div class="sl-meter"><i style="width:'+Math.min(100,t?u*100/t:0)+'%"></i></div><b>'+bn(u)+' / '+bn(t)+'</b></div>';}
 function chTitle(f){var L=window.CHAPTERS||[];for(var i=0;i<L.length;i++)if(L[i].file.split('/').pop()===f+'.html')return L[i].title;return f;}
 function dash(){
  var a=SL.acc(),s=SL.status(a),P=C.PLANS[a.kind],c=SL.counts(a),pl=SL.profiles(a),pg=SL.progress(a.email);
  var st=s.state==='active'?(s.comp?'🎁 ফ্রি অ্যাক্সেস (অ্যাডমিন দিয়েছে)':'✅ চালু'):s.state==='trial'?'🆓 ফ্রি অ্যাকাউন্ট (শুধু ফ্রি অধ্যায়)':s.state==='suspended'?'🚫 বন্ধ':'⛔ মেয়াদ শেষ';
  var h='<div class="sl-hero" style="margin-bottom:8px"><span class="sl-chip">'+P.emoji+' '+esc(P.name)+'</span><h1>'+(P.isSchool&&a.school?esc(a.school):'হ্যালো, '+esc(a.name)+' 👋')+'</h1></div>'+DEMO;
  h+='<div class="sl-box"><h2>📌 প্ল্যানের অবস্থা</h2><div class="sl-stat"><div><small>অবস্থা</small><b>'+st+'</b></div><div><small>বাকি দিন</small><b>'+bn(s.left)+' দিন</b></div><div><small>মেয়াদ শেষ</small><b style="font-size:19px">'+(s.until?fd(s.until):'—')+'</b></div><div><small>ক্লাস</small><b style="font-size:19px">'+(s.state==='active'?(s.comp?'সব ক্লাস':SL.bandsLabel(SL.myBands(a))):'—')+'</b></div><div><small>ডিভাইস লিমিট</small><b>'+bn(P.devices)+'টি</b></div></div>'+(a.kind==='custom'?'<p style="margin:12px 0 0;font-size:17px">🧩 <b>'+bn(a.seats||1)+' জন</b> · বিষয়: <b>'+((a.subs||[]).map(function(k){return SL.SUBJ[k];}).join(', ')||'—')+'</b></p>':'')+'</div>';
  /* সদস্য */
  h+='<div class="sl-box" id="members"><h2>👥 সদস্য</h2><div class="sl-stat" style="margin-bottom:10px">'+meter(c.students,P.students,'শিক্ষার্থী')+(P.teachers?meter(c.teachers,P.teachers,'শিক্ষক'):'')+'</div>';
  h+=pl.map(function(p){var on=(a.active||'owner')===p.id;
   return '<div class="sl-mem"><div class="av">'+esc(p.name.charAt(0))+'</div><div class="nm">'+esc(p.name)+'<small>'+SL.ROLE[p.role]+(p.id==='owner'?' (তুমি)':'')+'</small></div>'
   +(on?'<span class="on">এখন পড়ছে</span>':'<button class="slb s" style="padding:5px 14px;font-size:14px" data-act="'+p.id+'">এই প্রোফাইলে পড়ো</button>')
   +(p.id!=='owner'?'<button class="slb r" data-rm="'+p.id+'">মুছো</button>':'')+'</div>';}).join('');
  if(a.kind==='student')h+='<p style="color:#5b6b78">স্টুডেন্ট প্ল্যানে শুধু তুমি। আরও সদস্য যোগ করতে ফ্যামিলি/স্কুল প্ল্যান নাও।</p>';
  else h+='<form id="fm" class="sl-f" style="grid-template-columns:2fr 1fr auto;align-items:end;margin-top:14px"><div><label>নতুন সদস্যের নাম</label><input id="mn"></div><div><label>ভূমিকা</label><select id="mr"><option value="student">শিক্ষার্থী</option>'+(P.isSchool?'<option value="teacher">শিক্ষক</option>':'')+'</select></div><button class="slb p" type="submit">➕ যোগ করো</button></form><div id="e3" class="sl-err" style="margin-top:10px"></div>';
  h+='</div>';
  /* ডিভাইস */
  if(SL.cloud){var dl=a.devs||[],me=SL.devId();h+='<div class="sl-box" id="devs"><h2>📱 লগইন করা ডিভাইস ('+bn(dl.length)+' / '+bn(P.devices)+')</h2>'+(dl.length?dl.map(function(x){var cur=x.id===me;return '<div class="sl-mem"><div class="av">'+(/Android|iOS/.test(x.n)?'📱':'💻')+'</div><div class="nm">'+esc(x.n)+(cur?' <b style="color:#2a9d8f">(এই ডিভাইস)</b>':'')+'<small>শেষ ব্যবহার: '+fd(x.t)+'</small></div>'+(cur?'':'<button class="slb r" data-dv="'+esc(x.id)+'">সরাও</button>')+'</div>';}).join(''):'<p style="color:#5b6b78;margin:0">কোনো ডিভাইস নিবন্ধিত নেই।</p>')+'<p style="color:#5b6b78;font-size:14.5px;margin:8px 0 0">একসাথে সর্বোচ্চ '+bn(P.devices)+'টি ডিভাইসে লগইন থাকা যায়। লিমিট পূর্ণ হলে নতুন ডিভাইসে ঢুকতে আগে একটা সরাতে হয়। লগআউট করলেও জায়গা খালি হয়।</p></div>';}
  /* অগ্রগতি */
  h+='<div class="sl-box"><h2>📈 অগ্রগতি রিপোর্ট</h2>';
  var any=false;
  pl.forEach(function(p){var o=pg[p.id]||{},ks=Object.keys(o);if(!ks.length&&pl.length>1){h+='<details class="sl-q"><summary>'+esc(p.name)+' — এখনও কুইজ দেয়নি</summary></details>';return;}
   any=any||ks.length>0;var avg=ks.length?Math.round(ks.reduce(function(x,k){return x+o[k].pc;},0)/ks.length):0;
   if(!ks.length)return;
   h+='<details class="sl-q"'+(pl.length===1?' open':'')+'><summary>'+esc(p.name)+' — '+bn(ks.length)+'টি অধ্যায়, গড় '+bn(avg)+'%</summary>'+ks.map(function(k){return '<div class="sl-pg"><span style="flex:1.4">'+esc(chTitle(k))+'</span><div class="sl-meter meter"><i style="width:'+o[k].pc+'%"></i></div><b>'+bn(o[k].s)+'/'+bn(o[k].t)+'</b></div>';}).join('')+'</details>';});
  if(!any)h+='<p style="color:#5b6b78;margin:0">কুইজ দিলে এখানে স্কোর জমা হবে। যেকোনো অধ্যায়ের কুইজ শেষ করে দেখো।</p>';
  h+='</div>';
  /* পেমেন্ট */
  var optPlan=Object.keys(C.PLANS).filter(function(k){return (!C.PLANS[k].off||k===a.kind)&&(SL.cloud||!C.PLANS[k].custom);}).map(function(k){return '<option value="'+k+'"'+(k===a.kind?' selected':'')+'>'+C.PLANS[k].emoji+' '+C.PLANS[k].name+'</option>';}).join('');
