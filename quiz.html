<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>কুইজ — ShikboLab</title>
<meta name="description" content="ShikboLab কুইজ।">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Hind Siliguri',sans-serif;background:linear-gradient(180deg,#f3f8fc,#fbf8f1) fixed;color:#22303c;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,4vw,40px);background:#fff;border-bottom:1px solid #e3eaf0}header a{color:#1f3a5f;font-weight:700;text-decoration:none}main{padding:24px clamp(14px,4vw,28px) 60px}.card{display:block;max-width:820px;margin:12px auto;background:#fff;border:1px solid #e3eaf0;border-radius:18px;padding:14px 18px;text-decoration:none;color:#1f3a5f;font-weight:700;box-shadow:0 8px 20px rgba(31,58,95,.06)}.card small{display:block;color:#5b6b78;font-weight:500}h1.t{max-width:820px;margin:0 auto 10px;color:#1f3a5f}.bk{max-width:820px;margin:0 auto 10px}.bk a{color:#3f6fd1;font-weight:600}</style>
<script src="js/content.js"></script>
<script src="js/quiz-view.js"></script>
</head>
<body>
<header><a href="index.html">Shikbo<span style="color:#e76f51">Lab</span></a><a href="index.html">← হোম</a></header>
<main id="m"></main>
<script>
(function(){
 var m=document.getElementById('m'),P=new URLSearchParams(location.search),id=P.get('id'),C=window.SL_CONTENT||{quizzes:[],questions:[]};
 var draft=P.get('draft')==='1';
 if(draft){try{var d=JSON.parse(localStorage.getItem('sl_content_draft')||'null');if(d&&d.quizzes)C=d;}catch(e){}}
 var L=(C.quizzes||[]).filter(function(z){return draft||z.state==='published';});
 function t(x){var e=document.createElement('div');e.textContent=x;return e.innerHTML;}
 if(id){var one=L.filter(function(z){return z.id===id;})[0];
  if(!one){m.innerHTML='<div class="bk"><a href="quiz.html">← সব কুইজ</a></div><h1 class="t">কুইজটি পাওয়া যায়নি</h1>';return;}
  document.title=one.title+' — ShikboLab';m.innerHTML='<div class="bk"><a href="quiz.html">← সব কুইজ</a></div><div id="qb"></div>';SLQuiz.render(one,C,document.getElementById('qb'));
 }else{
  m.innerHTML='<h1 class="t">🏆 কুইজ</h1>'+(L.length?L.map(function(z){return '<a class="card" href="quiz.html?id='+encodeURIComponent(z.id)+'">'+t(z.title)+'<small>'+(z.qids||[]).length+'টি প্রশ্ন'+(z.time?' · '+z.time+' মিনিট':'')+'</small></a>';}).join(''):'<p style="max-width:820px;margin:0 auto;color:#5b6b78">এখনও কোনো কুইজ প্রকাশিত হয়নি।</p>');
 }
})();
</script>
<script src="js/site-config.js"></script>
</body>
</html>
